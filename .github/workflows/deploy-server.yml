name: Deploy server Duta Global Group
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: duta-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: website
    env:
      DGG_DEPLOY_TARGET: cloudflare
      DGG_WORKER_NAME: ${{ vars.DGG_WORKER_NAME }}
      DGG_D1_DATABASE_ID: ${{ vars.DGG_D1_DATABASE_ID }}
      DGG_D1_DATABASE_NAME: ${{ vars.DGG_D1_DATABASE_NAME }}
      DGG_R2_BUCKET_NAME: ${{ vars.DGG_R2_BUCKET_NAME }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify required configuration
        run: |
          node scripts/check-production.mjs
          node scripts/configure-auth-secrets.mjs --check
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: website/package.json
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Test access rules and build
        run: |
          node --test tests/production-config.test.mjs
          node tests/access-policy.test.mjs
          node tests/mutation-security.test.mjs
          node tests/read-access.test.mjs
          pnpm build
          node scripts/check-production.mjs --built
      - name: Apply tracked database migrations
        run: pnpm exec wrangler d1 migrations apply DB --remote --config dist/server/wrangler.json
      - name: Deploy application
        run: node scripts/configure-auth-secrets.mjs
      - name: Publish Worker
        run: pnpm exec wrangler deploy --config dist/server/wrangler.json
